name: links

# Links in the README, the docs and the project page. Monthly, because the pages they point at
# move without this repo changing.
on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/**.html']
  schedule:
    - cron: '29 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # A link to one of this repository's own files on main is checked against the checkout:
      # github.com answers 503 to a checker now and then for its larger pages, and the file
      # on disk is the one that link will show once this commit is on main.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429
            --exclude '^https://github\.com/Real-Fruit-Snacks/shell-tunnel/(issues/new|security/advisories/new)'
            --remap '^https://github\.com/Real-Fruit-Snacks/shell-tunnel/blob/main/(.*)$ file://${{ github.workspace }}/$1'
            './**/*.md' 'docs/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
