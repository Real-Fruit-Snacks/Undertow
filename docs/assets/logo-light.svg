<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="undercurrentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sepLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal frame -->
  <g transform="translate(100, 110)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="1.5" opacity="0.4" filter="url(#softGlow)"/>

    <!-- Surface wave — calm, thin, teal, gentle curve across upper portion -->
    <path d="M-38,-18 C-25,-22 -10,-12 0,-16 S20,-22 38,-18"
          fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Surface endpoint node — visible, teal, small -->
    <circle cx="-28" cy="-18" r="3" fill="#0d9488" opacity="0.6"/>

    <!-- Undercurrent — powerful downward sweep from surface to bottom-right -->
    <path d="M-10,-15 C-2,-8 5,8 8,18 S18,35 30,40"
          fill="none" stroke="url(#undercurrentGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Hidden server node — large, bright, at the bottom of the pull -->
    <circle cx="30" cy="40" r="5" fill="#0284c7" filter="url(#nodeGlow)"/>
    <circle cx="30" cy="40" r="2.5" fill="white"/>

    <!-- Particle trail — dots following the undercurrent path downward -->
    <circle cx="-4" cy="-10" r="1.3" fill="#2563eb" opacity="0.55"/>
    <circle cx="1" cy="-2" r="1.1" fill="#2563eb" opacity="0.45"/>
    <circle cx="4" cy="7" r="1.0" fill="#6366f1" opacity="0.40"/>
    <circle cx="7" cy="15" r="1.2" fill="#6366f1" opacity="0.50"/>
    <circle cx="12" cy="24" r="0.9" fill="#6366f1" opacity="0.35"/>
    <circle cx="18" cy="31" r="1.1" fill="#0284c7" opacity="0.45"/>
    <circle cx="24" cy="37" r="0.8" fill="#0284c7" opacity="0.30"/>

    <!-- Extra scattered particles near the current -->
    <circle cx="14" cy="18" r="0.7" fill="#2563eb" opacity="0.25"/>
    <circle cx="22" cy="28" r="0.6" fill="#6366f1" opacity="0.20"/>
    <circle cx="9" cy="22" r="0.8" fill="#0284c7" opacity="0.30"/>
  </g>

  <!-- Typography -->
  <!-- UNDERTOW title -->
  <text x="390" y="98" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="800" fill="url(#titleGrad)" text-anchor="middle"
        letter-spacing="8" filter="url(#glow)">UNDERTOW</text>

  <!-- Separator line -->
  <rect x="290" y="112" width="200" height="1.5" rx="0.75" fill="url(#sepLine)"/>

  <!-- Tagline -->
  <text x="390" y="136" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace"
        font-size="11.5" fill="#64748b" text-anchor="middle"
        letter-spacing="3">STEALTH SSH SERVER</text>

  <!-- Descriptor -->
  <text x="390" y="158" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace"
        font-size="9" fill="#94a3b8" text-anchor="middle"
        letter-spacing="2">GO · STATIC · TLS · SFTP</text>
</svg>
