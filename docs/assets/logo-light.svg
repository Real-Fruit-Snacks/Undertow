<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <defs>
    <!-- Primary gradient: deep blue to indigo -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent gradient: emerald to blue -->
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Icon gradient: vertical deep blue to indigo -->
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Undercurrent gradient: deep blue to indigo -->
    <linearGradient id="gCurrent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Subtle glow for the logomark -->
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#0284c7" flood-opacity="0.1" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- Node glow -->
    <filter id="nodeglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ===================== LOGOMARK ===================== -->
  <g transform="translate(58, 40)" filter="url(#softglow)">

    <!-- Hexagonal frame — thin, elegant -->
    <path d="M 80 6 L 140 38 L 140 102 L 80 134 L 20 102 L 20 38 Z"
          fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.35"/>

    <!-- Inner hex subtle fill -->
    <path d="M 80 14 L 134 42 L 134 98 L 80 126 L 26 98 L 26 42 Z"
          fill="#0284c7" opacity="0.04"/>

    <!-- === THE UNDERTOW === -->

    <!-- Surface wave — calm, thin, teal, gentle curve across upper portion -->
    <path d="M 30 42 C 50 36, 65 50, 80 44 S 110 36, 130 42"
          fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Surface node — small, teal, visible at left -->
    <circle cx="30" cy="42" r="3" fill="#0d9488" opacity="0.65"/>

    <!-- Undercurrent — powerful downward-swooping curve from surface to depths -->
    <path d="M 70 46 C 62 58, 55 75, 60 90 S 75 110, 90 115"
          fill="none" stroke="url(#gCurrent)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Hidden server node — large, bright, at the bottom of the pull -->
    <circle cx="90" cy="115" r="5" fill="#0284c7" opacity="0.9" filter="url(#nodeglow)"/>
    <circle cx="90" cy="115" r="2.5" fill="#ffffff"/>

    <!-- Particle trail along undercurrent -->
    <circle cx="67" cy="55" r="1.5" fill="#2563eb" opacity="0.5"/>
    <circle cx="62" cy="65" r="1.3" fill="#2563eb" opacity="0.45"/>
    <circle cx="58" cy="76" r="1.2" fill="#6366f1" opacity="0.4"/>
    <circle cx="58" cy="85" r="1.1" fill="#6366f1" opacity="0.35"/>
    <circle cx="63" cy="95" r="1.3" fill="#0284c7" opacity="0.4"/>
    <circle cx="72" cy="105" r="1.0" fill="#0284c7" opacity="0.3"/>
    <circle cx="82" cy="112" r="0.9" fill="#6366f1" opacity="0.25"/>

    <!-- Extra scattered particles near the current -->
    <circle cx="70" cy="70" r="0.8" fill="#0d9488" opacity="0.2"/>
    <circle cx="55" cy="90" r="0.7" fill="#2563eb" opacity="0.18"/>
    <circle cx="75" cy="100" r="0.8" fill="#6366f1" opacity="0.2"/>

    <!-- Corner accents on hex -->
    <circle cx="80" cy="6" r="2" fill="#06b6d4" opacity="0.25"/>
    <circle cx="80" cy="134" r="2" fill="#2563eb" opacity="0.25"/>
  </g>

  <!-- ===================== TYPOGRAPHY ===================== -->

  <!-- "UNDERTOW" -->
  <text x="415" y="108"
        font-family="'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="8"
        fill="url(#g1)" text-anchor="middle">UNDERTOW</text>

  <!-- Thin separator line -->
  <line x1="280" y1="128" x2="550" y2="128"
        stroke="url(#g1)" stroke-width="0.8" opacity="0.2"/>

  <!-- Tagline -->
  <text x="415" y="152"
        font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="11.5" font-weight="400" letter-spacing="5.5"
        fill="#57534e" text-anchor="middle">STEALTH SSH SERVER</text>

  <!-- Descriptor -->
  <text x="415" y="172"
        font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace"
        font-size="9" font-weight="400" letter-spacing="3"
        fill="#a8a29e" text-anchor="middle">GO  ·  STATIC  ·  TLS  ·  SFTP</text>
</svg>
