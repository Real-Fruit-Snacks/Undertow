<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sepLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal frame -->
  <g transform="translate(100, 110)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="1.5" filter="url(#softGlow)"/>

    <!-- Crossing flow curves -->
    <path d="M-35,-15 C-15,-15 -5,15 15,15 S35,5 42,0" fill="none" stroke="url(#flowGrad1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-35,15 C-15,15 -5,-15 15,-15 S35,-5 42,0" fill="none" stroke="url(#flowGrad2)" stroke-width="2" stroke-linecap="round"/>

    <!-- Center node -->
    <circle cx="0" cy="0" r="4" fill="#2563eb" filter="url(#glow)"/>

    <!-- Entry nodes -->
    <circle cx="-35" cy="-15" r="2.5" fill="#0284c7" opacity="0.9"/>
    <circle cx="-35" cy="15" r="2.5" fill="#6366f1" opacity="0.9"/>

    <!-- Exit node -->
    <circle cx="42" cy="0" r="2.5" fill="#2563eb" opacity="0.9"/>

    <!-- Particle dots -->
    <circle cx="-20" cy="-5" r="1.2" fill="#0284c7" opacity="0.5"/>
    <circle cx="-10" cy="8" r="1" fill="#6366f1" opacity="0.4"/>
    <circle cx="10" cy="-8" r="1" fill="#0284c7" opacity="0.4"/>
    <circle cx="25" cy="5" r="1.2" fill="#6366f1" opacity="0.5"/>
    <circle cx="5" cy="12" r="0.8" fill="#2563eb" opacity="0.35"/>
    <circle cx="20" cy="-12" r="0.8" fill="#2563eb" opacity="0.35"/>
  </g>

  <!-- Typography -->
  <!-- UNDERTOW title -->
  <text x="390" y="98" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="800" fill="url(#titleGrad)" text-anchor="middle"
        letter-spacing="8" filter="url(#glow)">UNDERTOW</text>

  <!-- Separator line -->
  <rect x="290" y="112" width="200" height="1.5" rx="0.75" fill="url(#sepLine)"/>

  <!-- Tagline -->
  <text x="390" y="136" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace"
        font-size="11.5" fill="#64748b" text-anchor="middle"
        letter-spacing="3">STEALTH SSH SERVER</text>

  <!-- Descriptor -->
  <text x="390" y="158" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace"
        font-size="9" fill="#94a3b8" text-anchor="middle"
        letter-spacing="2">GO · STATIC · TLS · SFTP</text>
</svg>
