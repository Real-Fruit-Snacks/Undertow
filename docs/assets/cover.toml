# Cover + social preview. Regenerate from the folder holding both clones:
#   python3 rfs-brand/tools/make-cover.py shell-tunnel/docs/assets/cover.toml
# Preview at 1200, 830, and 400 px in both themes:
#   python3 rfs-brand/tools/make-cover.py shell-tunnel/docs/assets/cover.toml --preview preview.png
name        = "shell-tunnel"
description = "Static SSH server for bind and reverse shells, PTY and SFTP"

# The tool as a flow: the operator builds a tuned binary, the target runs it,
# and a plain ssh client gets the session. Status lines are real output.
[panel]
kind   = "flow"
status = [
  "ok listening on 0.0.0.0:4444",
  "ok listening at home on 127.0.0.1:41827",
]

[panel.input]
label = "target"
note  = "runs the static binary"
chips = ["reverse", "bind", "tls"]
tone  = "amber"

[panel.tool]
label = "shell-tunnel"
note  = "shells · sftp · forward"

[panel.output]
label = "operator"
note  = "plain ssh client"
value = "PTY shell"
tone  = "mint"
