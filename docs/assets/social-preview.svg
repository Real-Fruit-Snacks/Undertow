  <line x1="340" y1="340" x2="940" y2="340" stroke="url(#grad)" stroke-width="0.8" opacity="0.2"/>
  <text x="640" y="390" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="22" font-weight="400" fill="#7f849c" letter-spacing="8">STEALTH SSH SERVER</text>
  <text x="640" y="440" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="16" font-weight="400" fill="#585b70" letter-spacing="5">GO  ·  STATIC  ·  TLS  ·  SFTP</text>
